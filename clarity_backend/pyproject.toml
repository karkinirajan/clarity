[project]
name = "clarity-backend"
version = "1.0.0"
description = "Clarity backend: a Django REST API for a directory of companies, with an admin for editing it and an OpenAI helper for drafting descriptions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.9",
    "django-ckeditor>=6.7",
    "django-import-export>=4.3",
    "django-jazzmin>=3.0",
    "dj-database-url>=3.1,<4",
    "whitenoise>=6.12,<7",
    "gunicorn>=25",
    "psycopg[binary]>=3.3,<4",
    "pillow>=12",
    "requests>=2.32",
    "openai>=2",
    "nh3>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "ruff>=0.8",
    "faker>=30",
    "django-debug-toolbar>=5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clarity.settings_test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["pages", "tests"]
addopts = "--cov=pages --cov=clarity --cov-report=term-missing"

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
