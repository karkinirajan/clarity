# Production-style stack: gunicorn + PostgreSQL + nginx on port 80.
#   cp deploy.env.example deploy.env   (then edit)   or export the variables
#   docker compose -f docker-compose-deploy.yml up -d --build
# TLS is not terminated here: put a TLS proxy / load balancer in front, or keep HTTPS_ONLY=false
# while the site is reachable over plain HTTP only.
services:
  app:
    build: .
    restart: always
    environment:
      SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set DJANGO_ALLOWED_HOSTS}
      DATABASE_URL: postgres://${DB_USER:?}:${DB_PASS:?}@db:5432/${DB_NAME:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      HTTPS_ONLY: ${HTTPS_ONLY:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - web_data:/vol/web
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    build: ./proxy
    restart: always
    depends_on: [app]
    ports: ["80:8000"]
    volumes:
      - web_data:/vol/web:ro

volumes:
  postgres_data:
  web_data:
