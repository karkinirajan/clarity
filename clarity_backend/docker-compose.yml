# Development: Django's dev server on http://localhost:8000 with PostgreSQL.
#   docker compose up --build
#   docker compose run --rm app python manage.py loaddata companies.json
#   docker compose run --rm test
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment: &env
      DEBUG: "true"
      SECRET_KEY: local-development-only-secret
      DATABASE_URL: postgres://devuser:changeme@db:5432/devdb
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      args:
        WITH_DEV: "1"
    command: pytest -q
    profiles: ["test"]

volumes:
  dev-db-data:
